<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>webtop</title>
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#0a0b0d; --fg:#edf0f5; --dim:#727b8c; --dim2:#3f4657;
  --hair:rgba(255,255,255,.075); --hair2:rgba(255,255,255,.14);
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:400 15px/1.45 -apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none;
}
body.mode-site{background:transparent}
.glow{position:fixed;inset:-20% -10% auto;height:70vh;pointer-events:none;
  background:radial-gradient(50% 55% at 50% 0,rgba(120,150,255,.10),transparent 70%);
  animation:breathe 14s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
@media (max-width:760px){.glow{display:none}}

/* header: drag zone + window buttons */
.bar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px 0 16px}
.mark{font:600 12px/1 inherit;letter-spacing:.14em;text-transform:lowercase;color:var(--dim2)}
.wbtns{display:flex;gap:2px}
.wbtns button{width:30px;height:26px;border:0;background:none;color:var(--dim);
  font:400 13px/1 inherit;cursor:default}
.wbtns button:hover{color:var(--fg)}
.wbtns button.x:hover{color:#ff6b6b}

/* stage */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 32px;gap:0}
.when{font-size:12px;letter-spacing:.1em;text-transform:lowercase;color:var(--dim2);margin-bottom:26px}
.ask{width:100%;max-width:640px;display:flex;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--hair);padding:6px 2px 10px;transition:border-color .2s}
.ask:focus-within{border-color:var(--hair2)}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);
  font:300 clamp(22px,3.2vw,30px)/1.2 inherit;letter-spacing:-.01em}
.ask input::placeholder{color:var(--dim2)}
.ask .kbd{font-size:12px;color:var(--dim2);transition:color .2s}
.ask:focus-within .kbd{color:var(--dim)}

/* answer */
.answer{width:100%;max-width:640px;margin-top:30px;opacity:0;transform:translateY(4px);
  transition:opacity .18s ease,transform .18s ease}
.answer.on{opacity:1;transform:none}
.hero{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;
  border:1px solid transparent;cursor:default}
.hero:hover{border-color:var(--hair);background:rgba(255,255,255,.02)}
.tile{position:relative;flex:none;width:42px;height:42px;border-radius:11px;overflow:hidden;
  display:grid;place-items:center;font-size:17px;font-weight:600}
.tile img{position:absolute;inset:6px;width:30px;height:30px;object-fit:contain;opacity:0;transition:opacity .2s}
.tile img.ok{opacity:1}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{flex:none;font-size:12px;color:var(--dim2);text-align:right}
.why em{font-style:normal;color:var(--dim)}
.also{display:flex;flex-wrap:wrap;gap:18px;padding:2px 12px 0;font-size:13px;color:var(--dim2)}
.also button{border:0;background:none;color:inherit;font:inherit;cursor:default;padding:0}
.also button:hover{color:var(--fg)}
.also b{font-weight:500;color:var(--dim)}
.note{padding:16px 12px 0;font-size:12px;color:var(--dim2)}
.note b{font-weight:500;color:var(--dim)}

/* floating pill over a page */
.pill{display:none;position:absolute;inset:8px 8px auto;height:56px;align-items:center;gap:2px;
  padding:0 6px 0 10px;border-radius:14px;background:rgba(16,18,22,.92);
  border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(20px)}
body.mode-site .stage,body.mode-site .bar,body.mode-site .glow{display:none}
body.mode-site .pill{display:flex}
.pill button{flex:none;width:32px;height:32px;border:0;border-radius:9px;background:none;
  color:var(--dim);font-size:15px;line-height:1;cursor:default}
.pill button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.pill .sep{flex:none;width:1px;height:20px;background:var(--hair);margin:0 5px}
.pill .name{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--fg);padding-left:4px}
.pill .name i{font-style:normal;color:var(--dim2)}
.pill button.off{opacity:.28}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;
  max-width:70%;padding:8px 14px;border-radius:10px;background:#171a20;
  border:1px solid var(--hair2);font-size:13px;color:var(--dim)}
.toast.on{display:block}
</style>

const SITES=RAW.map((r,i)=>({n:r[0].trim(),d:r[1],u:"https://"+r[1],al:r[2].split(" ").filter(Boolean),
  t:r[3],rank:i+1,prior:Math.pow(1+i+1,-0.32)}));
const TOTAL=SITES.length;
const TWO=["co.uk","org.uk","com.br","com.au","co.jp","co.kr","co.in","com.mx","com.tr","co.nz","com.ua"];
const hostOf=u=>{try{return new URL(u).hostname.toLowerCase()}catch(e){return ""}};
function rootOf(h){
  if(!h)return "";
  const p=h.split(".").filter(Boolean);
  if(p.length<=2)return h;
  const tail=p.slice(-2).join(".");
  return TWO.includes(tail)?p.slice(-3).join("."):tail;
}

const QW="qwertyuiop[]asdfghjkl;'zxcvbnm,./", RU="йцукенгшщзхъфывапролджэячсмитьбю.";
function toRU(q){let o="";for(const ch of q.toLowerCase())o+=QW.includes(ch)?RU[QW.indexOf(ch)]:ch;return o}
const N=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}.]+/gu," ").trim();

/* ---------------- поиск и ранжирование ---------------- */
function coreOf(d){return d.replace(/^(ru\.|com\.|co\.|www\.|m\.)/,"").split(".")[0]}
function matchOne(q,s){
  const dom=N(coreOf(s.d)), name=N(s.n), als=s.al.map(N);
  if(q===dom||q===name||q===s.d||als.includes(q))return 1;
  if(dom.startsWith(q))return .88; if(name.startsWith(q))return .82;
  if(als.some(a=>a===q))return .8; if(als.some(a=>a.startsWith(q)))return .74;
  if(s.d.startsWith(q))return .7;
  if(q.length<2)return .3;
  const words=[...new Set([dom,name,...als].join(" ").split(" "))];
  if(words.some(w=>w.startsWith(q)))return .6;
  if(dom.includes(q))return .5;
  if(als.some(a=>a.includes(q))||name.includes(q))return .45;
  if(words.some(w=>w.includes(q)))return .38;
  let i=0;const hay=dom+name.replace(/ /g,"");
  for(const ch of q){const at=hay.indexOf(ch,i);if(at<0)return 0;i=at+1}
  return .28;
}
let HIST={}, LAST="";
function score(s,q){
  let m=matchOne(q,s);
  if(!m){const alt=N(toRU(q));if(alt!==q)m=matchOne(alt,s)*.95}
  if(!m)return 0;
  let v=m*s.prior;
  const h=HIST[rootOf(s.d)];
  if(h){
    v*=1+.22*Math.log(1+h.n);
    if(h.t&&Date.now()-h.t<18e5)v*=1.5;
    else if(h.t&&Date.now()-h.t>2592e6)v*=.93;
  }
  if(LAST&&LAST===rootOf(s.d))v*=1.06;
  return v;
}
function search(raw){
  const q=N(raw).replace(/\s/g,"");
  if(!q)return[];
  const out=[];
  for(const s of SITES){const v=score(s,q);if(v>0)out.push([s,v])}
  out.sort((a,b)=>b[1]-a[1]||a[0].rank-b[0].rank);
  return out;
}

/* пустое поле: три сайта дня — стабильны на сутки */
const h32=x=>{x=Math.imul(x^x>>>15,2246822519);x=Math.imul(x^x>>>13,3266489917);return(x^x>>>16)>>>0};
function todays(){
  const d=new Date(),seed=d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate();
  const w=d.getDay(),hr=d.getHours();
  const want=hr<11?["news","search","mail"]:hr<18?["work","dev","shop","search"]:["video","social","music","games"];
  const pool=SITES.filter(s=>s.rank<=90);
  const rank=x=>{const k=h32((x.rank*2654435761)^seed);
    return(want.includes(x.t)?0:1e9)+(want.includes(x.t)?0:1)+k};
  return[...pool].sort((a,b)=>rank(a)-rank(b)).slice(0,3);
}
function whenText(){
  const d=new Date(),hr=d.getHours(),wd=d.getDay();
  const part=hr<5?"ночи":hr<12?"утра":hr<18?"дня":"вечера";
  const day=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][wd];
  return day+", "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")+" "+part;
}

const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
function tile(node,s){
  const hue=h32(s.d.length*7+s.rank*31)%360;
  const d=el("div","tile");d.style.background=`linear-gradient(145deg,hsl(${hue} 42% 24%),hsl(${(hue+38)%360} 38% 15%))`;
  d.style.color=`hsl(${hue} 55% 84%)`;d.textContent=s.n[0].toUpperCase();
  const img=new Image();img.onload=()=>img.classList.add("ok");img.src=`https://www.google.com/s2/favicons?domain=${s.d}&sz=128`;
  d.appendChild(img);node.appendChild(d);
}
let current=[];
function render(raw){
  const ans=$("answer"),her=$("hero"),als=$("also"),note=$("note");
  her.innerHTML="";als.innerHTML="";note.innerHTML="";
  let list,headNote;
  if(!raw.trim()){
    list=todays().map(s=>[s,1]);current=list;
    headNote="сегодня чаще всего открывают";
  }else{
    list=search(raw);current=list;
  }
  if(!list.length){
    ans.classList.remove("on");return;
  }
  const [top]=list[0];
  tile(her,top);
  const who=el("div","who");who.appendChild(el("b",null,top.n));who.appendChild(el("span",null,top.d));
  her.appendChild(who);
  const why=el("div","why");
  const h=HIST[rootOf(top.d)];
  if(raw.trim()){
    const i=el("em",null,h?`открывали ${h.n}${h.n===1?" раз":" раза"}`:"популярнее всех");
    why.append(i,el("div",null,"Enter"));
  }else why.append(el("em",null,headNote),el("div",null,"Enter"));
  her.appendChild(why);
  her.onclick=()=>open(top.u);
  if(list.length>1){
    for(const [s] of list.slice(1,3)){
      const b=el("button",null,s.n);b.onclick=()=>open(s.u);als.append(b,el("b",null,s.d));
    }
  }
  if(raw.trim()&&list.length>3)note.append(
    el("b",null,"ещё "+(Math.min(list.length,999)-3)),
    " совпадений в списке из "+TOTAL+" — показаны три, лучший сверху");
  ans.classList.add("on");
}
function open(u){post({type:"go",url:u,ext:!send})}

/* ---------------- мост с хостом ---------------- */
const send=window.chrome&&window.chrome.webview?window.chrome.webview.postMessage.bind(window.chrome.webview):null;
function post(m){if(send)send(m);else toast("открой через webtop.exe")}
function toast(t){const n=$("toast");n.textContent=t;n.classList.add("on");clearTimeout(toast._);toast._=setTimeout(()=>n.classList.remove("on"),2600)}

$("q").addEventListener("input",e=>render(e.target.value));
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();if(current[0])open(current[0][0].u)}
  if(e.key==="Escape"&&document.body.classList.contains("mode-search")){e.target.value="";render("")}
});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>post({type:b.dataset.a}));
document.addEventListener("mousedown",e=>{
  const t=e.target.closest(".bar,.pill");
  if(t&&!e.target.closest("button")&&!e.target.closest("input"))post({type:"drag"});
});

window.__ready=m=>{
  HIST={};
  for(const row of (m.history||[]))HIST[row.host]={n:row.n,t:row.t};
  LAST=m.url?rootOf(hostOf(m.url)):"";
  setMode(m.mode||"search");
  if(m.mode==="site"){paintPill(m.url,m.title,!!m.back,!!m.fwd);setTimeout(()=>q().focus(),40)}
  else render("");
};
const q=()=>$("q");
window.__mode=m=>setMode(m);
function setMode(m){
  const site=m==="site";
  document.body.classList.toggle("mode-site",site);
  document.body.classList.toggle("mode-search",!site);
  if(!site){q().value="";render("");setTimeout(()=>q().focus(),40)}
  else setTimeout(()=>q().select(),40);
}
window.__nav=n=>paintPill(n.url,n.title,!!n.back,!!n.fwd);
function paintPill(url,title,back,fwd){
  const host=hostOf(url||""),root=rootOf(host);
  if(root)LAST=root;
  const s=root?SITES.find(x=>rootOf(x.d)===root):null;
  const name=s?s.n:host;
  const p=$("pname");p.innerHTML="";
  p.append(el("b",null,name||"веб-страница"));
  if(title&&title.toLowerCase()!==String(name||"").toLowerCase())p.append(el("i",null," — "+title.replace(/\s+/g," ").slice(0,54)));
  $("bback").classList.toggle("off",!back);
  $("bfwd").classList.toggle("off",!fwd);
}
setInterval(()=>{if(document.body.classList.contains("mode-search"))$("when").textContent=whenText()},2e4);
$("when").textContent=whenText();
if(send)post({type:"ready"});else{setMode("search");render("")}
if(location.hash==="#selftest"){
  const cases=["вид","jpjy","ozon","гугл","wiki","кино","x","ав"];
  const lines=cases.map(c=>{
    const r=search(c).slice(0,3);
    return c+" -> "+(r.length?r.map(x=>x[0].n+" "+x[1].toFixed(3)).join(", "):"НЕТ");
  });
  $("q").value="вид";render("вид");
  post({type:"log",text:"SELFTEST\n"+lines.join("\n")+"\n"});
}
</script>
