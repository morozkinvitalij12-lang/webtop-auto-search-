<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>webtop</title>
<style>
*{box-sizing:border-box;margin:0}
:root{
  --fg:#edf0f5; --dim:#7d8698; --dim2:#4a5162;
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.16);
}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#101318,#0a0b0d 62%); color:var(--fg);
  font:400 15px/1.45 -apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none;
}
.frame{position:fixed;inset:0;border:1px solid rgba(255,255,255,.10);border-radius:20px;pointer-events:none}
.glow{position:fixed;left:-10%;right:-10%;top:-25%;height:70%;pointer-events:none;
  background:radial-gradient(50% 55% at 50% 0,rgba(120,150,255,.13),transparent 70%);
  animation:breathe 14s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}

.wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 20px 12px}
.head{display:flex;align-items:center;gap:12px;height:22px;font-size:12px}
.mark{font-weight:600;letter-spacing:.14em;text-transform:lowercase;color:var(--dim2)}
.when{color:var(--dim2);letter-spacing:.04em}
.key{margin-left:auto;padding:3px 8px;border:1px solid var(--hair);border-radius:999px;
  color:var(--dim);font-size:11px;letter-spacing:.04em}

.ask{display:flex;align-items:baseline;gap:12px;margin-top:6px;padding:2px 2px 9px;border-bottom:1px solid var(--hair)}
.ask:focus-within{border-color:var(--hair2)}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);
  font:300 clamp(22px,2.6vw,28px)/1.25 inherit;letter-spacing:-.01em}
.ask input::placeholder{color:#414857}
.kbd{font-size:12px;color:#414857}
.ask:focus-within .kbd{color:var(--dim)}

.answer{margin-top:14px;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease}
.answer.on{opacity:1;transform:none}
.hero{display:flex;align-items:center;gap:13px;padding:8px 10px;border-radius:13px;border:1px solid transparent}
.hero:hover{border-color:var(--hair);background:rgba(255,255,255,.03)}
.tile{position:relative;flex:none;width:38px;height:38px;border-radius:10px;overflow:hidden;
  display:grid;place-items:center;font-size:16px;font-weight:600}
.tile img{position:absolute;inset:6px;width:26px;height:26px;object-fit:contain;opacity:0;transition:opacity .2s}
.tile img.ok{opacity:1}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{flex:none;text-align:right;font-size:11.5px;color:var(--dim2);line-height:1.35}
.why em{font-style:normal;display:block;color:var(--dim);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.also{display:flex;flex-wrap:wrap;gap:16px;padding:4px 10px 0;font-size:12.5px;color:var(--dim2)}
.also button{border:0;background:none;color:inherit;font:inherit;cursor:default;padding:0}
.also button:hover{color:var(--fg)}
.also b{font-weight:500;color:var(--dim)}
.web{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 10px 0;font-size:12.5px;color:var(--dim2)}
.web a{color:var(--dim);cursor:default;border-bottom:1px solid transparent}
.web a:hover{color:var(--fg);border-color:var(--hair2)}
.foot{margin-top:auto;display:flex;gap:14px;align-items:center;font-size:11.5px;color:#414a5a}
.foot button{border:0;background:none;color:inherit;font:inherit;cursor:default;padding:0}
.foot button:hover{color:var(--fg)}
.foot .grow{margin-left:auto}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;max-width:80%;
  padding:7px 12px;border-radius:9px;background:#171a20;border:1px solid var(--hair2);font-size:12.5px;color:var(--dim)}
.toast.on{display:block}
</style>
</head>

<div class="glow"></div>
<div class="frame"></div>

<div class="wrap">
  <div class="head">
    <div class="mark">webtop</div>
    <div class="when" id="when"></div>
    <div class="key" id="key">Ctrl + Space</div>
  </div>

  <div class="ask">
    <input id="q" spellcheck="false" autocomplete="off" placeholder="две буквы, пара слов или адрес">
    <div class="kbd">&#8629;</div>
  </div>

  <div class="answer" id="answer">
    <div class="hero" id="hero"></div>
    <div class="also" id="also"></div>
    <div class="web" id="web"></div>
  </div>

  <div class="foot">
    <span>Esc &mdash; спрятать</span>
    <span class="grow"></span>
    <button data-a="hide">скрыть</button>
    <button data-a="quit">выйти</button>

const QW="qwertyuiop[]asdfghjkl;'zxcvbnm,./", RU="йцукенгшщзхъфывапролджэячсмитьбю.";
function toRU(q){let o="";for(const ch of q.toLowerCase())o+=QW.includes(ch)?RU[QW.indexOf(ch)]:ch;return o}
const N=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}.:-]+/gu," ").trim();

/* ---------------- совпадение одного слова с сайтом ---------------- */
function coreOf(d){return d.replace(/^(ru\.|com\.|co\.|www\.|m\.)/,"").split(".")[0]}
function matchOne(q,s){
  const dom=N(coreOf(s.d)), name=N(s.n), als=s.al.map(N);
  if(q===dom||q===name||q===s.d||als.includes(q))return 1;
  if(dom.startsWith(q))return .88; if(name.startsWith(q))return .82;
  if(als.some(a=>a.startsWith(q)))return .74;
  if(s.d.startsWith(q))return .7;
  if(q.length<2)return .3;
  const words=[...new Set([dom,name,...als].join(" ").split(" "))];
  if(words.some(w=>w.startsWith(q)))return .6;
  if(dom.includes(q))return .5;
  if(als.some(a=>a.includes(q))||name.includes(q))return .45;
  if(words.some(w=>w.includes(q)))return .38;
  let i=0;const hay=dom+name.replace(/ /g,"");
  for(const ch of q){const at=hay.indexOf(ch,i);if(at<0)return 0;i=at+1}
  return .28;
}
let HIST={}, LAST="";
function one(s,t){
  let v=matchOne(t,s);
  if(!v){const alt=N(toRU(t));if(alt&&alt!==t)v=matchOne(alt,s)*.95}
  return v;
}
function boost(s,v){
  if(!v)return 0;
  let out=v*s.prior;
  const h=HIST[rootOf(s.d)];
  if(h){
    out*=1+.22*Math.log(1+h.n);
    if(h.t&&Date.now()-h.t<18e5)out*=1.5;
    else if(h.t&&Date.now()-h.t>2592e6)out*=.93;
  }
  if(LAST&&LAST===rootOf(s.d))out*=1.06;
  return out;
}
/* сила совпадения и итоговый вес с учётом истории */
function siteScore(s,toks){
  let sum=0,ok=0;
  const min=toks.length>1?.45:.2; // несколько слов засчитываем только явным совпадениям
  for(const t of toks){const v=one(s,t);if(v>=min){sum+=v;ok++}}
  if(!ok)return null;
  let m=sum/ok;
  if(ok<toks.length)m*=Math.pow(.4,toks.length-ok);
  else if(ok>1)m=Math.min(1,m*1.15);
  return [m,boost(s,m)];
}
function bySites(toks){
  const out=[];
  for(const s of SITES){const r=siteScore(s,toks);if(r)out.push([s,r[0],r[1]])}
  out.sort((a,b)=>b[2]-a[2]||a[0].rank-b[0].rank);
  return out;
}
function engineFor(t){
  let best=null,bv=0;
  for(const s of SITES){
    if(!SQ[s.d])continue;
    const v=one(s,t);
    if(v>.82&&v>bv){bv=v;best=s}
  }
  return best;
}
function catHits(tag){
  const out=SITES.filter(s=>s.t===tag).map(s=>[s,boost(s,1)]);
  out.sort((a,b)=>b[1]-a[1]||a[0].rank-b[0].rank);
  return out;
}

/* ---------------- разбор запроса ---------------- */
function hit(n,d,u,why,site){return {n,d,u,why,site:site||null}}
function urlGuess(text){
  const s=text.trim().replace(/\s+/g,"").toLowerCase();
  if(!s.includes("."))return null;
  const m=s.match(/^(?:https?:\/\/)?((?:[a-z0-9_][-a-z0-9_]*\.)+[a-z]{2,}|localhost|\d{1,3}(?:\.\d{1,3}){3})(\/[^\s]*)?$/);
  if(!m)return null;
  const host=m[1], path=m[2]||"";
  const root=rootOf(host), site=SITES.find(x=>rootOf(x.d)===root);
  return hit(site?site.n:host,host+path,"https://"+host+path,"адрес",site);
}
function webHit(d,q){
  const s=SITES.find(x=>x.d===d);
  return hit(s?s.n:d,"искать «"+q+"» в интернете",SQ[d]+encodeURIComponent(q),"поиск в "+(s?s.n:d),s);
}
function webList(q){
  const ds=[...WEB].sort((a,b)=>(HIST[rootOf(b)]?.n||0)-(HIST[rootOf(a)]?.n||0));
  return ds.map(d=>webHit(d,q));
}
function whyTop(s,v){
  const h=HIST[rootOf(s.d)];
  if(h)return "открывали "+h.n+(h.n===1?" раз":" раза");
  if(v>=.85)return "точное совпадение";
  return "популярнее всех";
}

/* адрес → движок+запрос → категория → список → интернет */
function plan(raw){
  const text=String(raw||"").trim();
  if(!text)return {hits:todays().map(s=>hit(s.n,s.d,s.u,"сегодня открывают",s)),cat:null,web:null,empty:true};
  const addr=urlGuess(text);
  if(addr)return {hits:[addr],cat:null,web:null};
  const toks=N(text).split(" ").filter(Boolean);
  if(!toks.length)return {hits:[],cat:null,web:text};

  if(toks.length>1){
    const e=engineFor(toks[0]);
    if(e){
      const rest=text.split(/\s+/).slice(1).join(" ");
      return {hits:[hit(e.n,"запрос: "+rest,SQ[e.d]+encodeURIComponent(rest),"поиск в "+e.n,e)],cat:null,web:null};
    }
  }
  if(toks.length===1){
    const tag=CAT[toks[0]];
    if(tag){
      const rows=catHits(tag);
      if(rows.length>2)
        return {hits:rows.slice(0,5).map(([s,v])=>hit(s.n,s.d,s.u,whyTop(s,v),s)),cat:toks[0],catN:rows.length,web:null};
    }
  }
  const rows0=bySites(toks);
  const rows=toks.length>2?[]:rows0;   // длинная фраза — это запрос, а не название сайта
  const best=rows.length?rows[0][1]:0;
  const hits=rows.slice(0,5).map(([s,m,v])=>hit(s.n,s.d,s.u,whyTop(s,v),s));
  return {hits,cat:null,web:best<.5?text:null};
}

/* сайты дня — стабильны на сутки */
const h32=x=>{x=Math.imul(x^x>>>15,2246822519);x=Math.imul(x^x>>>13,3266489917);return(x^x>>>16)>>>0};
function todays(){
  const d=new Date(),seed=d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate();
  const hr=d.getHours();
  const want=hr<11?["news","search","mail"]:hr<18?["work","dev","shop","search"]:["video","social","music","games"];
  const pool=SITES.filter(s=>s.rank<=90);
  const rank=x=>{const k=h32((x.rank*2654435761)^seed);
    return(want.includes(x.t)?0:1e9)+(want.includes(x.t)?0:1)+k};
  return[...pool].sort((a,b)=>rank(a)-rank(b)).slice(0,3);
}
function whenText(){
  const d=new Date(),hr=d.getHours();
  const part=hr<5?"ночи":hr<12?"утра":hr<18?"дня":"вечера";
  const day=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][d.getDay()];
  return day+", "+String(hr).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" "+part;
}

/* ---------------- отрисовка ---------------- */
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
function tile(node,h){
  const s=h.site, key=s?s.d:(h.d.split("/")[0]||h.d);
  const hue=h32(String(key).length*7+(s?s.rank:13)*31)%360;
  const box=el("div","tile");
  box.style.background=`linear-gradient(145deg,hsl(${hue} 42% 24%),hsl(${(hue+38)%360} 38% 15%))`;
  box.style.color=`hsl(${hue} 55% 84%)`;
  box.textContent=(h.n||"?")[0].toUpperCase();
  if(s){
    const img=new Image();
    img.onload=()=>img.classList.add("ok");
    img.src="https://www.google.com/s2/favicons?domain="+s.d+"&sz=128";
    box.appendChild(img);
  }
  node.appendChild(box);
}
let current=[];
function render(raw){
  const p=plan(raw), her=$("hero"), als=$("also"), web=$("web");
  her.innerHTML="";als.innerHTML="";web.innerHTML="";
  current=p.hits;

  if(!p.hits.length&&p.web){
    const list=webList(p.web);
    current=[list[0]];
    showHero(her,list[0]);
    for(const h of list.slice(1,4)){
      const b=el("button",null,h.n);b.onclick=()=>open(h);als.append(b,el("b",null,"в интернете"));
    }
    $("answer").classList.add("on");return;
  }
  if(!p.hits.length){$("answer").classList.remove("on");return}

  showHero(her,p.hits[0]);
  for(const h of p.hits.slice(1,3)){
    const b=el("button",null,h.n);b.onclick=()=>open(h);als.append(b,el("b",null,h.d));
  }
  if(p.cat)web.append(el("span",null,"категория «"+p.cat+"» — сайтов "+p.catN+", лучший сверху"));
  else if(p.web){
    web.append(el("span",null,"в интернете:"),el("span",null,"·"));
    for(const h of webList(p.web)){
      const a=el("a",null,h.n);a.onclick=e=>{e.preventDefault();open(h)};web.append(a);
    }
  }
  else if(p.empty)web.append(el("span",null,"в списке "+TOTAL+" сайтов; если нужного нет — пара слов или «гугл погода»"));
  $("answer").classList.add("on");
}
function showHero(her,h){
  tile(her,h);
  const who=el("div","who");
  who.appendChild(el("b",null,h.n));
  who.appendChild(el("span",null,h.d));
  her.appendChild(who);
  const why=el("div","why");
  why.append(el("em",null,h.why),el("div",null,"Enter"));
  her.appendChild(why);
  her.onclick=()=>open(h);
}
function open(h){
  if(!h||!h.u)return;
  const r=rootOf(hostOf(h.u));
  if(r){
    LAST=r;
    const c=HIST[r]||{n:0,t:0};
    HIST[r]={n:c.n+1,t:Date.now()};
  }
  post({type:"go",url:h.u});
}

/* ---------------- мост с хостом ---------------- */
const send=window.chrome&&window.chrome.webview?window.chrome.webview.postMessage.bind(window.chrome.webview):null;
function post(m){if(send)send(m);else toast("печать только внутри webtop.exe")}
function toast(t){const n=$("toast");n.textContent=t;n.classList.add("on");clearTimeout(toast._);toast._=setTimeout(()=>n.classList.remove("on"),2600)}

$("q").addEventListener("input",e=>render(e.target.value));
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    const text=e.target.value.trim();
    open(current[0]||(text?webList(text)[0]:null));
    return;
  }
  if(e.key==="Escape"){
    if(e.target.value){e.target.value="";render("")}
    else post({type:"hide"});
  }
});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>post({type:b.dataset.a}));

window.__ready=m=>{
  HIST={};
  for(const row of (m.history||[]))HIST[row.host]={n:row.n,t:row.t};
  LAST=m.history&&m.history.length?m.history[0].host:"";
  if(m.hotkey)$("key").textContent=m.hotkey;
  render($("q").value);
};
window.__show=()=>{
  $("q").value="";render("");
  setTimeout(()=>$("q").focus(),20);
};
setInterval(()=>{$("when").textContent=whenText()},2e4);
$("when").textContent=whenText();
if(send)post({type:"ready"});else{render("");setTimeout(()=>$("q").focus(),50)}
