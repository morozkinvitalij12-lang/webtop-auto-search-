name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file exe
        run: dotnet publish webtop.csproj -c Release -o publish

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item publish/webtop.exe out/webtop-windows-x64.exe -Force
          $mb = [math]::Round((Get-Item out/webtop-windows-x64.exe).Length / 1MB, 1)
          "exe size: $mb MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($mb -gt 98) { "WARNING: больше 100 MB — GitHub не примет такой ассет, нужен zip-вариант" | Out-File -Append $env:GITHUB_STEP_SUMMARY }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/webtop-windows-x64.exe
          body: |
            Один файл: скачай → запусти → напиши две буквы.
            Нужен WebView2 Runtime (ставится вместе с Edge).

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: webtop-windows-x64
          path: out/webtop-windows-x64.exe
